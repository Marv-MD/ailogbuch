<!-- Bug-Report Bereich (am Seitenende platzieren) -->
<section id="bug-report" style="padding:2em;background:#f8f8f8;border-top:1px solid #ddd;margin-top:2em;">
  <h2>🐞 Bug melden</h2>
  <form id="bugReportForm">
    <label>
      Titel:<br>
      <input type="text" name="title" required>
    </label><br><br>
    <label>
      Beschreibung:<br>
      <textarea name="description" rows="5" required></textarea>
    </label><br><br>
    <label>
      Deine E-Mail (für Rückfragen):<br>
      <input type="email" name="reporter" required>
    </label><br><br>
    <button type="submit">Bug melden</button>
  </form>
  <div id="bugReportStatus" style="margin-top:1em;color:green;"></div>
</section>

<!-- EmailJS Integration -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init('PIkve0yxBKuIHgFSB');

  document.getElementById('bugReportForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const title = form.title.value;
    const description = form.description.value;
    const reporter = form.reporter.value;

    const status = document.getElementById('bugReportStatus');
    status.style.color = 'gray';
    status.textContent = 'Wird gesendet ...';

    // E-Mail versenden
    try {
      await emailjs.send('service_9z4i0xk', 'template_rmizoxk', {
        title, description, reporter,
        to_email: 'marvin.mergen@gmail.com'
      });
      status.style.color = 'green';
      status.textContent = 'Danke! Bug-Report wurde gesendet.';
      form.reset();
    } catch (err) {
      status.style.color = 'red';
      status.textContent = 'Fehler beim E-Mail-Versand!';
    }
  });
</script>
